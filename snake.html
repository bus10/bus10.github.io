<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - CAN U BE</title>
    <meta name="description" content="Play Snake on Can U Be. Smooth industrial visuals with precision keyboard controls.">
    <meta property="og:title" content="Snake Game - CAN U BE">
    <meta property="og:description" content="Smooth industrial visuals with precision keyboard controls.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bus10.github.io/snake.html">
    <meta property="og:image" content="https://bus10.github.io/images/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Snake Game - CAN U BE">
    <meta name="twitter:description" content="Smooth industrial visuals with precision keyboard controls.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" tabindex="0" aria-label="Toggle theme">Light</button>
    
    <div class="container center">
        <h1>Snake</h1>
        
    <a href="index.html" class="nav-link" tabindex="0" aria-label="Back to home">← Back to Home</a>
        
        <div class="score">Score: <span id="score">0</span></div>
        
        <div style="width:100%;max-width:400px;margin:0 auto;">
            <canvas id="gameCanvas" width="400" height="400" style="width:100%;height:auto;display:block;touch-action:none;"></canvas>
        </div>
        
        <div class="controls">
            Use arrow keys, WASD, or swipe to move
        </div>
        
        <div id="gameOver" class="game-over" style="display: none;">
            Game Over - Press Space to restart
        </div>
        
        <div class="footer">
            Website made by @bus0
        </div>
    </div>
    
    <script src="cub-state.js"></script>
    <script src="theme.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchActive = false;
        let score = 0;
        let gameRunning = true;
        const initialDailyMode = window.CUBState ? (window.CUBState.getActiveDailyMode() || 'OFF') : 'ARCHIVE';
        const gameTickMs = initialDailyMode === 'OVERCLOCK' ? 85 : 100;

        function setDirection(nx, ny) {
            if (dx === 0 && dy === 0) {
                dx = nx;
                dy = ny;
                nextDx = nx;
                nextDy = ny;
            } else {
                nextDx = nx;
                nextDy = ny;
            }
        }

        function trySetDirection(nx, ny) {
            if (!gameRunning) return;
            if ((dx === 0 && dy === 0) || !(nx === -dx && ny === -dy)) {
                setDirection(nx, ny);
            }
        }

        // Generate random food position that is NOT on the snake body
        function randomFood() {
            // Build a set of occupied cells for O(1) lookup
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            const freeCells = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) {
                    const key = `${x},${y}`;
                    if (!occupied.has(key)) freeCells.push({ x, y });
                }
            }
            // If no free cells remain, end game (win condition)
            if (freeCells.length === 0) {
                gameOver();
                return;
            }
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }
        
        // Get current theme colors
        function getThemeColors() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            return {
                bg: isLight ? '#fff' : '#000',
                fg: isLight ? '#000' : '#fff',
                apple: isLight ? '#e74c3c' : '#ff6b6b'  // Red apple in both themes
            };
        }

        // Interpolation for smooth movement
        let interpolation = 0;
        let lastSnake = [...snake];

        // Draw everything with smooth animations
        function draw() {
            const colors = getThemeColors();
            
            // Clear canvas with theme background
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = colors.fg;
            ctx.globalAlpha = 0.15;
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                const p = i * gridSize + 0.5;
                ctx.beginPath();
                ctx.moveTo(p, 0);
                ctx.lineTo(p, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, p);
                ctx.lineTo(canvas.width, p);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Draw snake with smooth interpolation
            ctx.fillStyle = colors.fg;
            snake.forEach((segment, index) => {
                let drawX = segment.x;
                let drawY = segment.y;
                
                // Smooth movement interpolation
                if (interpolation < 1 && lastSnake[index]) {
                    drawX = lastSnake[index].x + (segment.x - lastSnake[index].x) * interpolation;
                    drawY = lastSnake[index].y + (segment.y - lastSnake[index].y) * interpolation;
                }
                
                ctx.fillRect(drawX * gridSize, drawY * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw apple with distinct color
            ctx.fillStyle = colors.apple;
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Update game state
        function update() {
            if (!gameRunning) return;
            // Don't move if no direction is set
            if (dx === 0 && dy === 0) return;

            // Save previous snake position for smooth interpolation
            lastSnake = snake.map(seg => ({...seg}));
            interpolation = 0;

            // Apply queued direction change (prevents double turns in one frame)
            if ((nextDx !== 0 || nextDy !== 0) && (dx === 0 && dy === 0 || !(nextDx === -dx && nextDy === -dy))) {
                dx = nextDx;
                dy = nextDy;
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                randomFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
            if (window.CUBState) {
                window.CUBState.setBestSnake(score);
                window.CUBState.recordGamePlayed();
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            nextDx = 0;
            nextDy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            randomFood();
        }

        // Animation loop for smooth rendering
        function animate() {
            if (interpolation < 1) {
                interpolation += 0.15; // Smooth step increment
                if (interpolation > 1) interpolation = 1;
            }
            draw();
            requestAnimationFrame(animate);
        }

        // Game logic loop
        function gameLoop() {
            update();
        }

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            // Prevent page scroll with arrow keys and spacebar
            if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
            if (!gameRunning && e.code === 'Space') {
                resetGame();
                return;
            }

            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    trySetDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    trySetDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    trySetDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    trySetDirection(1, 0);
                    break;
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            e.preventDefault();

            if (!gameRunning) {
                resetGame();
                return;
            }

            touchActive = true;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (touchActive) {
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (!touchActive) return;
            e.preventDefault();
            touchActive = false;

            const touch = e.changedTouches && e.changedTouches[0];
            if (!touch) return;

            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            const minSwipeDistance = 24;

            if (Math.abs(deltaX) < minSwipeDistance && Math.abs(deltaY) < minSwipeDistance) {
                return;
            }

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                trySetDirection(deltaX > 0 ? 1 : -1, 0);
            } else {
                trySetDirection(0, deltaY > 0 ? 1 : -1);
            }
        }, { passive: false });

    // Initialize game
    dx = 0;
    dy = 0;
    nextDx = 0;
    nextDy = 0;
    randomFood();
    setInterval(gameLoop, gameTickMs);
    requestAnimationFrame(animate);  // Smooth rendering at 60 FPS
    </script>
</body>
</html>
