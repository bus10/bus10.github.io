<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Music Player on Can U Be. A single-track player for the main site song.">
    <meta property="og:title" content="Music Player - CAN U BE">

    <meta property="og:url" content="https://bus10.github.io/index1.html">
    <meta property="og:image" content="https://bus10.github.io/images/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Music Player - CAN U BE">

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" tabindex="0" aria-label="Toggle theme">Light</button>
    
    <div id="loader"></div>
    
    <div class="container center">
        <h1>CAN U BE</h1>
        
        <a href="index.html" class="nav-link" tabindex="0" aria-label="Back to home">← Back to Home</a>
        
        <audio controls>
            <source src="audio/canube.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div class="footer">
            Website made by @bus0
        </div>
    </div>
    
    <script src="cub-state.js"></script>
    <script src="theme.js"></script>
    <script>
        var audio = document.querySelector('audio');
        var loader = document.getElementById('loader');
        var container = document.querySelector('.container');

        audio.addEventListener('canplaythrough', function() {
            loader.style.display = 'none';
            container.style.display = 'block';
        });
    </script>
</body>
</html>
